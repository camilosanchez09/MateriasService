spring.application.name=materias-service

# ---- Datasource (PostgreSQL levantado con docker-compose.yml, propio de este módulo) ----
# En la nube se sobrescriben con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (secretos, nunca en git).
# DB_PORT permite cambiar el puerto local si choca con la BD de otro módulo.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/materias
spring.datasource.username=materias
spring.datasource.password=materias
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update: crea/actualiza tablas automáticamente a partir de las entidades (útil en desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Swagger / OpenAPI (springdoc) ----
# UI disponible en: http://localhost:8081/swagger-ui.html
# JSON del contrato en: http://localhost:8081/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Puerto propio del módulo (no debe chocar con Estudiantes, Inscripciones ni el Gateway)
server.port=8081

# ---- PDFs de las materias (Lab 4) ----
# Máximo 10 MB por archivo; el resto del multipart deja margen para las cabeceras.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Bucket PRIVADO de S3. Credenciales: rol de la tarea en la nube; AWS_ACCESS_KEY_ID/SECRET solo en local.
storage.s3.bucket=${S3_BUCKET:materias-pdfs}
storage.s3.region=${S3_REGION:us-east-1}
# Solo en local (RustFS, compatible con S3). En AWS se dejan vacíos.
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:}
storage.s3.path-style=${S3_FORCE_PATH_STYLE:false}
# Validez de la URL firmada de descarga
storage.s3.url-ttl=${PDF_URL_TTL:10m}

# ---- Script previo a Hibernate (columnas nuevas sobre bases existentes) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/antes-de-hibernate.sql
spring.sql.init.continue-on-error=false
