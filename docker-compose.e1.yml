# Reto E1 - Más piezas: Redis y MinIO
# Uso: docker compose -f docker-compose.yml -f docker-compose.e1.yml up -d
# Nota: MinIO borró minio/minio de Docker Hub (11-sep-2026) y Quay pide autenticación
# desde el 24-sep-2026; se usa pgsty/silo, un fork comunitario compatible con MinIO.
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]   # API S3 y consola web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mcli ready local || mc ready local || curl -fs http://localhost:9000/minio/health/live || wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]

volumes:
  minio-data: {}
