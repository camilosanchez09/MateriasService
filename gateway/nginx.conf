# Reto E2: Gateway de ejemplo. Único servicio publicado al anfitrión;
# reenvía todo al módulo Materias por la red interna "back".
server {
    listen 80;
    location / {
        proxy_pass http://materias:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
